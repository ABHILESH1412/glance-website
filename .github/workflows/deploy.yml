# Builds the site and publishes it to GitHub Pages: on every push to main, and
# every six hours, so a new Glance release reaches the site without a push.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *' # picks up a new Glance release within six hours
  workflow_dispatch: # a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Before building, `npm run build` asks GitHub for Glance's latest release
      # (scripts/fetch-release.mjs). If that fails, the build fails and the site
      # already live stays as it is, rather than going out with stale downloads.
      #
      # A repository named <user>.github.io is served from the domain root; any
      # other from /<repository-name>/. Worked out from GITHUB_REPOSITORY, which
      # scheduled runs have too (their event carries no repository details).
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STRICT: '1'
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          case "$name" in
            *.github.io) export BASE_PATH=/ ;;
            *) export BASE_PATH="/$name/" ;;
          esac
          echo "Building for $BASE_PATH"
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
